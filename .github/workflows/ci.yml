name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Ruff (lint + format)
        run: |
          uv run ruff check . --output-format github
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov=field_intel --cov-report=term-missing

      - name: Offline end-to-end demo
        env:
          FIELD_INTEL_DATABASE_URL: sqlite:///./data/ci/field_intel.db
        run: make demo DATA_DIR=data/ci

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: field-intel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --rm --name fi -p 8000:8000 field-intel:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 1
          done
          docker stop fi
